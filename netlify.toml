# Netlify hosts the static dashboard (frontend/) only — it cannot run Python.
# The FastAPI backend runs on Render (see render.yaml); Netlify forwards /api/* to it,
# so the browser only ever talks to the Netlify domain (no CORS needed).

[build]
  publish = "frontend"
  command = ""   # no build step: plain HTML/CSS/JS

# !!! Replace YOUR-RENDER-SERVICE with your Render service name (e.g. earth-trend-detective-api)
[[redirects]]
  from = "/api/*"
  to = "https://YOUR-RENDER-SERVICE.onrender.com/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
