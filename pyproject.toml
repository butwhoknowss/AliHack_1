[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
  "B008",  # FastAPI uses Depends()/Query() in argument defaults by design
  "E501",  # long plain-language strings (definitions, verdicts) read better unwrapped
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
